<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Permanence Architecture Diagram - PowerPoint Slide Visual</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 14px;
            color: #94a3b8;
        }
        .slide-container {
            width: 100%;
            max-width: 1600px;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .toolbar {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Object Permanence in AI-Generated Videos: Research Architecture</h1>
        <p>16:9 Presentation Slide Visual — 30% Currently Implemented Baseline vs. 70% Proposed Future Work</p>
    </div>

    <div class="slide-container">
        <object type="image/svg+xml" data="architecture_diagram.svg" width="100%" height="100%"></object>
    </div>

    <div class="toolbar">
        <a class="btn" href="architecture_diagram.svg" target="_blank">Open Fullscreen Vector SVG</a>
        <button class="btn" onclick="window.print()">Print / Export as PDF for PPT</button>
    </div>

</body>
</html>
